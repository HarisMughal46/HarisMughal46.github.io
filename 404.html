:root{

/* Dark — deep navy/charcoal (default when no preference or user picks dark) */
:root,[data-theme="dark"]{

  --n-0:#0a0f15; --n-1:#0e151d; --n-2:#141e28; --n-3:#1d2a36; --n-4:#2b3b49;

.bar i{width:10px;height:10px;border-radius:50%}.bar i:nth-child(1){background:var(--error)}.bar i:nth-child(2){background:var(--warning)}.bar i:nth-child(3){background:var(--success)}
.bar span{margin-left:var(--sp-2)}

h1{margin:0;font:700 var(--fs-4xl)/1 var(--font-head);letter-spacing:-.04em;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
